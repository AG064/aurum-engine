[workspace]
resolver = "2"
members = [
    "crates/aurum-core",
    "crates/aurum-godot",
    "crates/aurum-2d",
    "crates/aurum-3d",
    "crates/aurum-vn",
    "crates/aurum-vr",
    "crates/aurum-text",
    "crates/aurum-cli",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"
authors = ["Aleks"]

[workspace.dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "2.0"
godot = { git = "https://github.com/godot-rust/gdext", branch = "master", features = ["api-4-7"] }

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
