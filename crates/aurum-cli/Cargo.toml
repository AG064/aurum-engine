[package]
name = "aurum-cli"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
description = "Aurum CLI module: command-line interface. Useful for tools, asset processors, and server-side use cases."

[lib]
crate-type = ["rlib"]

[[bin]]
name = "aurum"
path = "src/main.rs"

[dependencies]
aurum-core = { path = "../aurum-core" }
aurum-mcp = { path = "../aurum-mcp" }
aurum-studio-core = { path = "../aurum-studio-core" }
aurum-studio-server = { path = "../aurum-studio-server" }
serde_json = { workspace = true }
