<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="referrer" content="no-referrer">
<title>Aurum Studio</title>
<link rel="stylesheet" href="/style.css">
</head>
<body>
<header>
  <h1>Aurum<span>Studio</span></h1>
  <div class="project" id="project">connecting</div>
  <div class="connection" id="connection" data-state="connecting">connecting</div>
</header>

<main>
  <section class="panel" id="controls">
    <h2>Project</h2>
    <div class="buttons">
      <button data-command="doctor">Doctor</button>
      <button data-command="build">Build</button>
      <button data-command="build" data-args='{"force":true}'>Rebuild</button>
      <button data-command="build" data-args='{"release":true}'>Release</button>
    </div>
    <h2>Run</h2>
    <div class="buttons">
      <button data-command="start-editor">Editor</button>
      <button data-command="start-game">Game</button>
      <button data-command="stop" class="warn">Stop</button>
    </div>
    <p class="note" id="busy"></p>
  </section>

  <section class="panel" id="health-panel">
    <h2>Health</h2>
    <div id="health" class="muted">not checked yet</div>
  </section>

  <section class="panel wide" id="log-panel">
    <h2>Activity <button id="clear" class="small">clear</button></h2>
    <ol id="log" class="log"></ol>
  </section>
</main>

<footer>
  <span>Godot is the workhorse. Studio only decides what to run, when, and whether it worked.</span>
  <button id="shutdown" class="small">Shut down Studio</button>
</footer>

<script src="/app.js"></script>
</body>
</html>
