<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="referrer" content="no-referrer">
<meta name="color-scheme" content="dark">
<title>Aurum Studio</title>
<link rel="stylesheet" href="/style.css">
</head>
<body>
<div class="ambient" aria-hidden="true"></div>
<div class="grain" aria-hidden="true"></div>

<div class="app">
  <header class="chrome">
    <div class="brand">
      <!-- Inline SVG on purpose, and with no namespace declaration: the page
           must contain no external reference of any kind, and HTML5 puts
           inline SVG in the right namespace without one. -->
      <svg class="mark" viewBox="0 0 24 24" aria-hidden="true">
        <defs>
          <linearGradient id="aurum" x1="0" y1="0" x2="0.7" y2="1">
            <stop offset="0" stop-color="#fbe6ae"/>
            <stop offset="0.42" stop-color="#d8a94f"/>
            <stop offset="1" stop-color="#7d5518"/>
          </linearGradient>
        </defs>
        <path d="M12 1.4 L22.3 22.6 H17.5 L12 9.9 L6.5 22.6 H1.7 Z" fill="url(#aurum)"/>
        <rect x="7.7" y="15.4" width="8.6" height="2.2" rx="1.1" fill="url(#aurum)"/>
      </svg>
      <div class="wordmark">Aurum<i>Studio</i></div>
    </div>

    <div class="connection" id="connection" data-state="connecting">
      <span class="pulse" aria-hidden="true"></span>
      <span class="connection-text">connecting</span>
    </div>
  </header>

  <section class="stage">
    <div class="identity">
      <div class="eyebrow">Project</div>
      <h1 class="project-name" id="project">opening</h1>
      <div class="project-path" id="project-path"></div>
    </div>

    <div class="health" id="health">
      <div class="health-idle">
        <span class="idle-mark" aria-hidden="true"></span>
        <span class="idle-hint">Run Doctor to check the toolchain,<br>the project, and the installed extension.</span>
      </div>
    </div>
  </section>

  <section class="controls">
    <div class="toolbar">
      <span class="toolbar-label">Build</span>
      <button data-command="doctor" title="Check the project and report what is wrong">
        <svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M2 12h4l3-7 4 14 3-7h6" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"/></svg>
        <span>Doctor</span>
      </button>
      <button data-command="build" class="primary" title="Build the debug extension and install it">
        <svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 3v10m0 0l-4-4m4 4l4-4M3.5 16.5V19a2 2 0 002 2h13a2 2 0 002-2v-2.5" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"/></svg>
        <span>Build</span>
      </button>
      <button data-command="build" data-args='{"force":true}' title="Rebuild even when the artifact is already current">
        <svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M20 12a8 8 0 11-2.4-5.7M20.5 3.5v4.2h-4.2" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"/></svg>
        <span>Rebuild</span>
      </button>
      <button data-command="build" data-args='{"release":true}' title="Build the optimised release extension">
        <svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 2.6l8.5 4.7v9.4L12 21.4 3.5 16.7V7.3z" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linejoin="round"/><path d="M3.5 7.3L12 12l8.5-4.7M12 12v9.4" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linejoin="round"/></svg>
        <span>Release</span>
      </button>
    </div>

    <div class="toolbar">
      <span class="toolbar-label">Launch</span>
      <button data-command="start-editor" title="Launch Godot on this project, supervised">
        <svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><rect x="2.8" y="4" width="18.4" height="16" rx="2.2" fill="none" stroke="currentColor" stroke-width="1.9"/><path d="M2.8 9h18.4" stroke="currentColor" stroke-width="1.9"/><circle cx="6" cy="6.5" r="0.9" fill="currentColor"/></svg>
        <span>Editor</span>
      </button>
      <button data-command="start-game" title="Run the project's game">
        <svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M6.8 3.6l13 8.4-13 8.4z" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linejoin="round"/></svg>
        <span>Game</span>
      </button>
      <button data-command="stop" class="danger" title="Stop only the processes Studio launched">
        <svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><rect x="5.6" y="5.6" width="12.8" height="12.8" rx="2" fill="none" stroke="currentColor" stroke-width="1.9"/></svg>
        <span>Stop</span>
      </button>
    </div>
  </section>

  <section class="console">
    <div class="console-head">
      <span class="console-title">Activity</span>
      <i class="rule"></i>
      <div class="status-line" id="busy" data-active="false">
        <span class="spinner" aria-hidden="true"></span>
        <span class="status-text"></span>
      </div>
      <button id="clear" class="ghost">Clear</button>
    </div>
    <ol id="log" class="log">
      <li class="log-empty">Waiting for the first event<span class="caret"></span></li>
    </ol>
  </section>

  <footer>
    <span class="foot-note">Godot is the workhorse. Studio decides what to run, when, and whether it worked.</span>
    <span class="foot-local">Loopback only &middot; token required</span>
    <button id="shutdown" class="ghost">Shut down</button>
  </footer>
</div>

<script src="/app.js"></script>
</body>
</html>
