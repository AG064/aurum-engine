[package]
name = "life_evolution"
version = "0.1.0"
edition = "2021"
description = "Life Evolution - Emergent Universe Simulation"
license = "MIT OR Apache-2.0"

[dependencies]
godot = { git = "https://github.com/godot-rust/gdext", branch = "master", features = ["api-4-7"] }
glam = { version = "0.28", features = ["libm"] }
rand = { version = "0.8", features = ["small_rng"] }
rayon = "1.10"
num_cpus = "1"
parking_lot = "0.12"
crossbeam-channel = "0.5"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
log = "0.4"
env_logger = "0.11"

[lib]
crate-type = ["cdylib"]

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
# Note: AVX2/FMA SIMD is auto-applied by glam when compiling with -O3 on x86-64.
